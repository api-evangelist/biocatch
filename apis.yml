aid: biocatch
name: BioCatch
description: >-
  BioCatch is a financial-fraud and financial-crime prevention platform that uses
  behavioral intelligence — analyzing how people physically interact with their
  devices — to detect threats that static rules and device recognition miss. The
  platform monitors account-opening fraud, account takeover, social-engineering
  scams, mule accounts, and money-laundering networks across the digital banking
  session. Marquee products include BioCatch Connect (the core telemetry and
  behavioral-analysis platform), Scams360, BioCatch Trust (an inter-bank fraud
  intelligence network), DeviceIQ / DeviceIQai device-trust assessment, mule and
  account-takeover protection, and Strong Customer Authentication. Integration is
  delivered under contract through platform components such as the Push API, Align
  SDK, Link, Fuse, the Insights Query Engine, and Rule Manager; developer
  documentation lives behind a login at docs.biocatch.com rather than a public
  developer portal. BioCatch serves 350+ global retail banks, protects over 680
  million accounts, and analyzes roughly 18 billion sessions monthly.
